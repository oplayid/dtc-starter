version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network

  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    networks:
      - medusa_network

  medusa:
    image: ghcr.io/oplayid/dtc-starter:latest
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    # Port host dihapus, Traefik Dokploy otomatis membaca port internal 9000
    expose:
      - "9000"
      - "5173"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/medusa-store
      - REDIS_URL=redis://redis:6379
    env_file:
      - apps/backend/.env
    entrypoint: ["sh", "./start.sh"]
    networks:
      - medusa_network

  storefront:
    image: ghcr.io/oplayid/dtc-starter:latest
    container_name: medusa_storefront
    restart: unless-stopped
    depends_on:
      - medusa
    # Port host dihapus, Traefik Dokploy otomatis membaca port internal 8000
    expose:
      - "8000"
    environment:
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://medusa:9000
      - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_masukkan_key_anda_disini
    env_file:
      - apps/storefront/.env
    entrypoint: ["sh", "./start-storefront.sh"]
    networks:
      - medusa_network

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge
